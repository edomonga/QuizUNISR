name: CI

# Controllo automatico prima del merge: ogni PR verso main (e ogni push su
# main, come rete di sicurezza) esegue i test automatici e una build
# completa. Se qualcosa si rompe, si vede QUI prima che vada in produzione,
# non dopo che qualcuno se ne accorge sul sito.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom (usato dai test) e la libreria realtime di Supabase
          # richiedono Node 22 o più recente: con Node 20 la build delle
          # dipendenze falliva ("Node.js 20 detected without native
          # WebSocket support" + errore di avvio di jsdom).
          node-version: '22'
          cache: 'npm'

      - name: Installa le dipendenze
        run: npm ci

      - name: Test automatici
        run: npm test

      - name: Build (compilazione + controllo tipi)
        run: npm run build
        env:
          # Valori fittizi: qui basta che il sito COMPILI, non serve un
          # progetto Supabase reale (nessuna chiamata di rete viene fatta
          # durante la build).
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
